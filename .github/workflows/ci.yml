name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run verify:deploy
      - run: npm run check
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: quembi-ui-website
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7
